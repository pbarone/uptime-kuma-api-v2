[pytest]
# `pytest` with no arguments runs the unit suite and nothing else.
#
# The integration tests are excluded by default because they are destructive:
# UptimeKumaTestCase.setUp deletes every monitor, notification, proxy, tag,
# status page, docker host, maintenance and API key on the server it connects
# to. Excluding them by default makes the dangerous thing opt-in rather than
# something a bare `pytest tests/` does by accident -- which the steering docs
# previously had to warn about in three separate places.
#
# The marker is applied automatically by tests/conftest.py, derived from the
# base class rather than from a list of filenames. See that file for why.
#
# To run the destructive suite deliberately, against a disposable instance only:
#     pytest -m integration
# Or use ./run_tests.sh, which creates and destroys its own containers and
# drives the tests through `unittest discover` (so it is unaffected by this
# file).
testpaths = tests
addopts = --strict-markers -m "not integration"
markers =
    integration: needs a live Uptime Kuma server at 127.0.0.1:3001 and DELETES ALL OF ITS DATA
